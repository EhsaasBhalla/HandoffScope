# Production Docker Compose Profile for HandoffScope
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handoffscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handoffscope_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-handoffscope}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handoffscope}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-handoffscope}:${POSTGRES_PASSWORD:-handoffscope_secure_pass_2026}@db:5432/${POSTGRES_DB:-handoffscope}
      - SECRET_KEY=${SECRET_KEY:-change-in-production-use-a-long-random-string}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost", "http://localhost:80"]}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - UPLOAD_DIR=/app/storage/uploads
    volumes:
      - upload_storage_prod:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    # Single-process uvicorn keeps the in-process ThreadPoolExecutor job pool and SSE bus cohesive
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata_prod:
  upload_storage_prod:
